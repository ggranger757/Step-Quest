# Step Quest server: leaderboards (3.10.4), and push notifications (mission reminders and the daily reminder).
# Setup: see "Leaderboards (free, optional)" in the main README.
name = "stepquest-push"
main = "src/index.js"
compatibility_date = "2026-10-01"

# runs every minute and sends whatever is due
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "stepquest-push"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # printed by: npx wrangler d1 create stepquest-push

[vars]
# where your Step Quest is hosted (comma-separated); requests from other sites are refused
ALLOWED_ORIGINS = "https://ggranger757.github.io,capacitor://localhost,https://localhost"
# a contact address push services can reach you at (required by the Web Push standard)
VAPID_SUBJECT = "mailto:you@example.com"
# secrets (not in this file), set with `npx wrangler secret put NAME`:
#   ADMIN_KEY                            your password for hiding or renaming leaderboard players (README: Leaderboards)
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY  only for push notifications
